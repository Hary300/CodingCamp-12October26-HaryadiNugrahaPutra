<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ── Top bar ── -->
    <header class="topbar">
      <div class="topbar__left">
        <span id="greeting-text"></span>
      </div>
      <div class="topbar__right">
        <button id="theme-toggle" class="btn btn--icon" aria-label="Toggle theme" title="Toggle Light / Dark mode">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </header>

    <!-- ── Clock & Date ── -->
    <section class="hero" aria-label="Current time and date">
      <div id="clock" class="hero__clock"></div>
      <div id="date-display" class="hero__date"></div>
    </section>

    <!-- ── Main grid ── -->
    <main class="dashboard">

      <!-- To-Do List -->
      <section class="card" id="todo-section" aria-label="To-Do List">
        <h2 class="card__title">📝 To-Do List</h2>

        <form id="todo-form" autocomplete="off">
          <div class="input-row">
            <input
              type="text"
              id="todo-input"
              class="input"
              placeholder="Add a new task…"
              maxlength="120"
              aria-label="New task"
            />
            <button type="submit" class="btn btn--primary">Add</button>
          </div>
          <p id="todo-error" class="error-msg" role="alert" aria-live="polite"></p>
        </form>

        <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
      </section>

      <!-- Focus Timer -->
      <section class="card" id="timer-section" aria-label="Focus Timer">
        <h2 class="card__title">⏱ Focus Timer</h2>
        <div class="timer-display" id="timer-display" aria-live="polite">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" class="btn btn--primary">Start</button>
          <button id="timer-stop" class="btn btn--secondary">Stop</button>
          <button id="timer-reset" class="btn btn--ghost">Reset</button>
        </div>
        <p class="timer-label" id="timer-label">Ready to focus?</p>
      </section>

      <!-- Quick Links -->
      <section class="card" id="links-section" aria-label="Quick Links">
        <h2 class="card__title">🔗 Quick Links</h2>

        <form id="link-form" autocomplete="off">
          <div class="input-row">
            <input
              type="text"
              id="link-name"
              class="input"
              placeholder="Name"
              maxlength="40"
              aria-label="Link name"
            />
            <input
              type="url"
              id="link-url"
              class="input"
              placeholder="https://…"
              aria-label="Link URL"
            />
            <button type="submit" class="btn btn--primary">Add</button>
          </div>
          <p id="link-error" class="error-msg" role="alert" aria-live="polite"></p>
        </form>

        <div id="links-grid" class="links-grid" aria-label="Saved links"></div>
      </section>

    </main>

    <!-- ── Name customisation modal ── -->
    <dialog id="name-modal" class="modal" aria-labelledby="modal-title">
      <div class="modal__content">
        <h3 id="modal-title">What's your name?</h3>
        <p>We'll use it for the greeting.</p>
        <input
          type="text"
          id="name-input"
          class="input"
          placeholder="Your name…"
          maxlength="40"
          aria-label="Your name"
        />
        <div class="modal__actions">
          <button id="name-save" class="btn btn--primary">Save</button>
          <button id="name-cancel" class="btn btn--ghost">Cancel</button>
        </div>
      </div>
    </dialog>

    <!-- Edit task modal -->
    <dialog id="edit-modal" class="modal" aria-labelledby="edit-modal-title">
      <div class="modal__content">
        <h3 id="edit-modal-title">Edit Task</h3>
        <input
          type="text"
          id="edit-input"
          class="input"
          maxlength="120"
          aria-label="Edit task text"
        />
        <p id="edit-error" class="error-msg" role="alert" aria-live="polite"></p>
        <div class="modal__actions">
          <button id="edit-save" class="btn btn--primary">Save</button>
          <button id="edit-cancel" class="btn btn--ghost">Cancel</button>
        </div>
      </div>
    </dialog>

    <script src="js/app.js"></script>
  </body>
</html>
